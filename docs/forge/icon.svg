<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Tactical Small Inner Border Clip Path (Identical to Flea Price Progression) -->
    <clipPath id="inner-border-clip">
      <polygon points="134,38 378,38 462,94 462,322 256,472 50,322 50,94" />
    </clipPath>

    <!-- Tactical Shield Base Gradients -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161E2C" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0E131C" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#070A0F" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="shield-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#B45309" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#78350F" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.65" />
    </linearGradient>

    <!-- Central Atmospheric Glow Gradient -->
    <linearGradient id="area-gradient-smooth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.10" />
      <stop offset="75%" stop-color="#78350F" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gold Gradients for Rat Facets, Banner, Collars & Stars -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="gold-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Barbell Industrial Steel Gradients -->
    <linearGradient id="barbell-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="80%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <linearGradient id="barbell-knurl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Heavy Cast-Iron Plate Gradients -->
    <linearGradient id="iron-plate-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1E293B" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="iron-plate-center" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374357" />
      <stop offset="35%" stop-color="#1E2738" />
      <stop offset="75%" stop-color="#0F1522" />
      <stop offset="100%" stop-color="#06090E" />
    </linearGradient>

    <!-- Tactical Rat Emblem Gradients -->
    <linearGradient id="rat-armor-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="35%" stop-color="#1F2937" />
      <stop offset="75%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <linearGradient id="rat-amber-eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Multi-Tier Gaussian Glow & Shadow Filters -->
    <filter id="glow-area" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <filter id="rat-eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="element-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. FULL-CANVAS TACTICAL PMC SHIELD BADGE BASE -->
  <g filter="url(#shield-shadow)">
    <!-- Outer Main Shield Body (Exact Same Geometry as Flea Price Progression) -->
    <polygon points="126,24 386,24 476,88 476,330 256,488 36,330 36,88"
             fill="url(#shield-bg)"
             stroke="url(#shield-border)"
             stroke-width="3" />
  </g>

  <!-- 2. SHIELD INTERIOR (ALIGNED TO INNER BORDER CLIP) -->
  <g clip-path="url(#inner-border-clip)">

    <!-- Deep Ambient Volumetric Glow Behind Centerpiece -->
    <circle cx="256" cy="225" r="160"
            fill="url(#area-gradient-smooth)"
            filter="url(#glow-area)" />

    <!-- 2A. HEAVY OLYMPIC BARBELL & MASSIVE CAST-IRON PLATES (CENTERPIECE) -->
    <g filter="url(#element-shadow)">
      <!-- Main Barbell Shaft (Solid Steel Bar Across Canvas) -->
      <rect x="52" y="219" width="408" height="18" rx="3"
            fill="url(#barbell-steel)"
            stroke="#070A0F" stroke-width="1.4" />

      <!-- Diamond Knurling Texture Grip Zones -->
      <rect x="164" y="220" width="54" height="16"
            fill="url(#barbell-knurl)" opacity="0.8" />
      <rect x="294" y="220" width="54" height="16"
            fill="url(#barbell-knurl)" opacity="0.8" />

      <!-- Polish Chrome Specular Reflection & Underside Shadow -->
      <line x1="54" y1="222" x2="458" y2="222" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9" />
      <line x1="54" y1="234.5" x2="458" y2="234.5" stroke="#000000" stroke-width="1.6" opacity="0.7" />

      <!-- ================= LEFT WEIGHT PLATES & OUTSIDE COLLAR ================= -->
      <!-- Left Barbell Lock-Jaw Collar Clamp (OUTSIDE TO SECURE PLATES) -->
      <rect x="64" y="205" width="14" height="46" rx="3.5"
            fill="url(#gold-mid)"
            stroke="#78350F" stroke-width="1.5" />
      <path d="M 71,205 L 71,190 M 65,190 L 77,190"
            stroke="#FFFBEB" stroke-width="2.4" stroke-linecap="round" />

      <!-- Plate 1: Outer Heavy Bumper (20 KG) -->
      <rect x="80" y="142" width="19" height="172" rx="4.5"
            fill="url(#iron-plate-outer)"
            stroke="#94A3B8" stroke-width="1.6" />
      <line x1="85" y1="149" x2="85" y2="307" stroke="#CBD5E1" stroke-width="1.3" opacity="0.75" />

      <!-- Plate 2: Middle Heavy Bumper (20 KG) -->
      <rect x="101" y="130" width="21" height="196" rx="4.5"
            fill="url(#iron-plate-outer)"
            stroke="#CBD5E1" stroke-width="1.7" />
      <line x1="107" y1="137" x2="107" y2="319" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />

      <!-- Plate 3: Inner Massive Bumper (20 KG) -->
      <rect x="124" y="118" width="24" height="220" rx="5"
            fill="url(#iron-plate-outer)"
            stroke="#E2E8F0" stroke-width="2" />
      <line x1="131" y1="125" x2="131" y2="331" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9" />
      <!-- Tactical Amber Trim Groove on Inner Plate -->
      <line x1="141" y1="127" x2="141" y2="329" stroke="#F59E0B" stroke-width="1.2" opacity="0.55" />

      <!-- Built-in Left Sleeve Stop (Shoulder) -->
      <rect x="148" y="214" width="5" height="28" rx="1.5"
            fill="url(#barbell-steel)" stroke="#070A0F" stroke-width="1" />

      <!-- ================= RIGHT WEIGHT PLATES & OUTSIDE COLLAR ================= -->
      <!-- Built-in Right Sleeve Stop (Shoulder) -->
      <rect x="359" y="214" width="5" height="28" rx="1.5"
            fill="url(#barbell-steel)" stroke="#070A0F" stroke-width="1" />

      <!-- Plate 3: Inner Massive Bumper (20 KG) -->
      <rect x="364" y="118" width="24" height="220" rx="5"
            fill="url(#iron-plate-outer)"
            stroke="#E2E8F0" stroke-width="2" />
      <line x1="381" y1="125" x2="381" y2="331" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9" />
      <!-- Tactical Amber Trim Groove on Inner Plate -->
      <line x1="371" y1="127" x2="371" y2="329" stroke="#F59E0B" stroke-width="1.2" opacity="0.55" />

      <!-- Plate 2: Middle Heavy Bumper (20 KG) -->
      <rect x="390" y="130" width="21" height="196" rx="4.5"
            fill="url(#iron-plate-outer)"
            stroke="#CBD5E1" stroke-width="1.7" />
      <line x1="405" y1="137" x2="405" y2="319" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />

      <!-- Plate 1: Outer Heavy Bumper (20 KG) -->
      <rect x="413" y="142" width="19" height="172" rx="4.5"
            fill="url(#iron-plate-outer)"
            stroke="#94A3B8" stroke-width="1.6" />
      <line x1="427" y1="149" x2="427" y2="307" stroke="#CBD5E1" stroke-width="1.3" opacity="0.75" />

      <!-- Right Barbell Lock-Jaw Collar Clamp (OUTSIDE TO SECURE PLATES) -->
      <rect x="434" y="205" width="14" height="46" rx="3.5"
            fill="url(#gold-mid)"
            stroke="#78350F" stroke-width="1.5" />
      <path d="M 441,205 L 441,190 M 435,190 L 447,190"
            stroke="#FFFBEB" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <!-- 2B. CENTRAL TRI-GRIP CAST-IRON OLYMPIC PLATE (HUB BACKGROUND) -->
    <g filter="url(#element-shadow)">
      <!-- Outer Iron Plate Rim -->
      <circle cx="256" cy="228" r="98"
              fill="url(#iron-plate-center)"
              stroke="url(#shield-border)" stroke-width="3" />
      <!-- Inner Machined Bevel Ring -->
      <circle cx="256" cy="228" r="88"
              fill="none"
              stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.45" />

      <!-- 3 Olympic Ergonomic Grip Cutouts (Tri-Grip Design) -->
      <!-- Top Grip Cutout -->
      <path d="M 226,145 C 240,140 272,140 286,145 C 293,156 288,166 278,163 C 266,160 246,160 234,163 C 224,166 220,156 226,145 Z"
            fill="#06090E" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.6" />
      <!-- Bottom-Left Grip Cutout -->
      <path d="M 183,266 C 176,278 188,300 200,307 C 212,309 218,301 213,292 C 206,282 197,268 197,259 C 195,251 187,253 183,266 Z"
            fill="#06090E" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.6" />
      <!-- Bottom-Right Grip Cutout -->
      <path d="M 329,266 C 336,278 324,300 312,307 C 300,309 294,301 299,292 C 306,282 315,268 315,259 C 317,251 325,253 329,266 Z"
            fill="#06090E" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.6" />

      <!-- Center Hub Recess -->
      <circle cx="256" cy="228" r="66"
              fill="#0B1017"
              stroke="#475569" stroke-width="1.8" />
    </g>

    <!-- 2C. HERO TACTICAL RAT PMC EMBLEM (PROMINENT, CENTERED & EMPOWERED) -->
    <!-- High-impact angular military operator insignia with intense golden predator gaze -->
    <g filter="url(#element-shadow)">
      <!-- Base Head/Armor Facets -->
      <polygon points="256,152 281,162 300,186 306,216 297,244 281,272 256,300 231,272 215,244 206,216 212,186 231,162"
               fill="url(#rat-armor-plate)"
               stroke="url(#shield-border)" stroke-width="2.4" stroke-linejoin="round" />

      <!-- Left Tactical Ear (Armor Plated with Internal Facet) -->
      <path d="M 231,170 L 191,114 C 185,105 196,97 206,105 L 244,156 Z"
            fill="url(#rat-armor-plate)"
            stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="202,120 229,159 216,153 198,124"
               fill="#F59E0B" opacity="0.35" />

      <!-- Right Tactical Ear (Armor Plated with Internal Facet) -->
      <path d="M 281,170 L 321,114 C 327,105 316,97 306,105 L 268,156 Z"
            fill="url(#rat-armor-plate)"
            stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="310,120 283,159 296,153 314,124"
               fill="#F59E0B" opacity="0.35" />

      <!-- Tactical Headband / Operator Armor Band -->
      <path d="M 218,184 L 256,175 L 294,184 L 291,194 L 256,185 L 221,194 Z"
            fill="url(#gold-mid)"
            stroke="#78350F" stroke-width="1.3" />

      <!-- Brow Ridge & Geometric Nose Bridge -->
      <polygon points="256,189 272,201 268,226 256,246 244,226 240,201"
               fill="#1E293B"
               stroke="#F59E0B" stroke-width="1.5" />

      <!-- Deadly Tactical Eyes (Intense Amber / Night Vision Glow) -->
      <!-- Left Eye -->
      <polygon points="227,204 243,198 239,212 226,213"
               fill="url(#rat-amber-eye)"
               stroke="#FFFBEB" stroke-width="1.3"
               filter="url(#rat-eye-glow)" />
      <!-- Right Eye -->
      <polygon points="285,204 269,198 273,212 286,213"
               fill="url(#rat-amber-eye)"
               stroke="#FFFBEB" stroke-width="1.3"
               filter="url(#rat-eye-glow)" />

      <!-- Bold Angular Tactical Whiskers (Sharp Speed Spikes) -->
      <g stroke="#FDE047" stroke-width="2.8" stroke-linecap="round" opacity="0.95">
        <!-- Left Whiskers -->
        <line x1="221" y1="222" x2="165" y2="211" />
        <line x1="219" y1="232" x2="157" y2="236" />
        <line x1="221" y1="242" x2="171" y2="260" />
        <!-- Right Whiskers -->
        <line x1="291" y1="222" x2="347" y2="211" />
        <line x1="293" y1="232" x2="355" y2="236" />
        <line x1="291" y1="242" x2="341" y2="260" />
      </g>

      <!-- Snout & Lethal Iron Incisors -->
      <polygon points="250,242 262,242 256,250" fill="#070A0F" stroke="#F59E0B" stroke-width="1.3" />
      <!-- Front Teeth (Biting into the Iron Workout) -->
      <rect x="250" y="251" width="5.5" height="13" rx="1.3" fill="#FFFBEB" stroke="#64748B" stroke-width="1.1" />
      <rect x="256.5" y="251" width="5.5" height="13" rx="1.3" fill="#FFFBEB" stroke="#64748B" stroke-width="1.1" />

      <!-- Lower Jaw Contour -->
      <polygon points="242,265 256,278 270,265 256,292"
               fill="#0A0E17"
               stroke="#F59E0B" stroke-width="1.5" />
    </g>

    <!-- 2D. PROMINENT "GYM RAT" MILITARY ROCKER TAB (MOVED UP & ENLARGED) -->
    <!-- Positioned proudly beneath the centerpiece for maximum visibility -->
    <g filter="url(#element-shadow)">
      <!-- Rocker Tab Body -->
      <polygon points="135,348 256,362 377,348 370,402 256,422 142,402"
               fill="url(#shield-bg)"
               stroke="url(#shield-border)" stroke-width="2.6" />
      <!-- Inner Gold Rim Accent -->
      <polygon points="143,355 256,368 369,355 363,396 256,414 149,396"
               fill="none"
               stroke="#F59E0B" stroke-width="1.3" stroke-opacity="0.55" />

      <!-- Left Tactical Gold 5-Point Star -->
      <polygon points="168,381 171,386 177,386 172,390 174,396 168,392 162,396 164,390 159,386 165,386"
               fill="url(#gold-bright)"
               stroke="#78350F" stroke-width="0.8" />

      <!-- Right Tactical Gold 5-Point Star -->
      <polygon points="344,381 347,386 353,386 348,390 350,396 344,392 338,396 340,390 335,386 341,386"
               fill="url(#gold-bright)"
               stroke="#78350F" stroke-width="0.8" />

      <!-- "GYM RAT" Stencil Bold Military Text (Enlarged & High Impact) -->
      <text x="256" y="396"
            text-anchor="middle"
            font-family="'Impact', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="26"
            font-weight="900"
            letter-spacing="5"
            fill="url(#gold-bright)"
            stroke="#070A0F"
            stroke-width="1">GYM RAT</text>
    </g>
  </g>

  <!-- 3. SMALL INNER BORDER (CRISP METALLIC RIM FRAMING THE GLOW PERFECTLY) -->
  <polygon points="134,38 378,38 462,94 462,322 256,472 50,322 50,94"
           fill="none"
           stroke="#F59E0B"
           stroke-opacity="0.22"
           stroke-width="1.4" />
</svg>
